# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: IndexFallDetector
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  FallDetectorKit:
    path: FallDetectorKit

targets:
  IndexFallDetector:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: FallDetectorKit
        product: DetectorCore
      - package: FallDetectorKit
        product: MarketData
    # Time-sensitive notifications need a paid developer account. With one, add:
    # entitlements:
    #   path: App/IndexFallDetector.entitlements
    #   properties:
    #     com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Index Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.IndexFallDetector.refresh
    # Bundle ID and signing team come from Config/Base.xcconfig + your git-ignored Config/Local.xcconfig.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
